# Release — the artifacts, and two locks in front of the registries.
#
# A `v*` tag builds every wheel and the sdist and attaches them to a GitHub
# Release. **It does not publish to PyPI or crates.io.** Those are separate
# jobs that run only on a deliberate `workflow_dispatch` naming the registry,
# because the tree has not been outside this repository yet and the first
# testers install from the Release page. A registry publish is irreversible in
# a way a Release is not: a version yanked from PyPI or crates.io can never be
# reused, so a wrong 0.1.0 costs the number permanently.
#
# The second lock is `environment:`. Both publish jobs name one, so a required
# reviewer configured on the repository holds them even if the dispatch is
# wrong. Neither registry job carries a token: PyPI uses trusted publishing
# (OIDC) and crates.io exchanges the same OIDC identity for a short-lived
# token, so there is no long-lived secret to leak from either.
#
# The wheel matrix is sized against `rpds_py`, the Rust/maturin package Sage
# already ships as **standard** (docs/record/python-and-sage-interop.md). It covers the
# same fourteen platforms; `abi3-py39` means one wheel per platform serves
# every Python from 3.9 up, which is what turns that package's 55 artifacts
# into 14 here. Which of those are Tier 1 and what Tier 2 means is written down
# in the README's Install section.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Registry to publish to. `none` builds artifacts only."
        required: true
        default: "none"
        type: choice
        options: [none, testpypi, pypi, crates, pypi+crates]
      ref:
        description: "Tag or commit to build. Defaults to the current branch."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  version:
    name: the tag and Cargo.toml agree
    runs-on: ubuntu-latest
    # The job is unconditional and the *step* is what checks for a tag. Gating
    # the job on `startsWith(github.ref, 'refs/tags/')` would skip it on a
    # `workflow_dispatch`, and a skipped dependency skips everything that needs
    # it — the whole matrix would vanish on exactly the runs that build for the
    # registries.
    #
    # The tag does not set the version — `Cargo.toml` does, and maturin and
    # `cargo publish` both read it from there. So a `v0.2.0` tag on a tree that
    # still says `0.1.0` produces a full matrix of wheels named 0.1.0 and a
    # Release page that disagrees with every file on it. Nothing else in this
    # workflow would notice. This job is that noticing, and it runs before the
    # 14 builds rather than after.
    steps:
      - uses: actions/checkout@v7
      - name: compare
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate"
          echo "tag:        $GITHUB_REF_NAME (version $tag)"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME wants version $tag, Cargo.toml says $crate"
            exit 1
          fi

  linux:
    name: manylinux ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      # Cross-compiled inside maturin's manylinux containers rather than
      # emulated: `abi3` needs no target interpreter at build time, so the
      # exotic architectures cost a normal compile rather than a QEMU one. That
      # is what makes armv7l, ppc64le, s390x and i686 affordable at all, and
      # they are not optional -- `rpds_py` ships them, and "fewer platforms
      # than the package you are displacing" is a concrete review objection
      # (docs/record/python-and-sage-interop.md).
      matrix:
        target: [x86_64, i686, aarch64, armv7, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: dist-manylinux-${{ matrix.target }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, i686, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v7
        with:
          name: dist-musllinux-${{ matrix.target }}
          path: dist

  macos:
    name: macos ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
      # `macos-15-intel` and `macos-15`, not `macos-13` and `macos-14`. The
      # first tag run sat in `queued` for 25 minutes on `macos-13` rather than
      # failing: that image is retired and no longer appears in
      # `actions/runner-images` at all, so nothing was ever going to pick the
      # job up. `macos-14` is deprecated on the same page. Intel macOS lives on
      # the `-intel` labels now.
      #
      # Both legs stay native, which is what earns them the import-and-compute
      # step below; cross-compiling x86_64 from arm64 would build the wheel and
      # never load it.
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Not 3.9, though that is the wheel's floor: `actions/python-versions`
      # has no darwin/arm64 build below 3.10, so asking for it here would fail
      # the aarch64 leg outright. It costs nothing — `abi3` means the build
      # does not depend on which interpreter is present, and the floor is
      # proven by the `wheel` job in ci.yml, which installs and computes on a
      # real 3.9.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      # Both macOS legs are native, so the wheel that was just built is the
      # wheel this runner can import. An abi3 wheel that builds and does not
      # load is the failure mode a build-only matrix cannot see.
      - name: the wheel imports and computes
        run: |
          pip install --no-index --find-links dist symfn
          cd "${{ runner.temp }}"
          python -c "
          import symfn
          from symfn import s, macdonald
          assert s([2, 1]) * s([1]) == s([1]) * s([2, 1])
          assert macdonald.P([2]).at(q=5, t=5) == s([2]).to('m')
          print('symfn', symfn.__version__, 'on', '${{ matrix.target }}')
          "
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist

  windows:
    name: windows ${{ matrix.target }}
    runs-on: windows-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      # 3.11 rather than the 3.9 floor, for the same reason as the macOS leg.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.target == 'x86' && 'x86' || 'x64' }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: the wheel imports and computes
        if: matrix.target == 'x64'
        run: |
          pip install --no-index --find-links dist symfn
          cd "${{ runner.temp }}"
          python -c "import symfn; from symfn import s; assert s([2,1])*s([1]) == s([1])*s([2,1]); print('symfn', symfn.__version__, 'on x64')"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist (vendored, offline)
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install maturin
      # The published sdist is the vendored one, not a bare `maturin sdist`:
      # the platforms below Tier 1 reach the library through this file, and
      # they build it with the network off.
      - run: scripts/build_sdist.sh
      - run: scripts/check_sdist_offline.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  docs:
    name: docs bundle (rustdoc + sphinx)
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r docsite/requirements.txt
      # Builds the extension, stages it, renders both references with warnings
      # denied on each, and bundles them with a landing page. Attached to the
      # Release because Read the Docs publishes the Python half and nothing
      # publishes the Rust half — until both have a public home, a tester who
      # downloaded a wheel has no reference to read beside it.
      - run: scripts/build_docs.sh
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: dist

  github-release:
    name: GitHub Release
    needs: [linux, musllinux, macos, windows, sdist, docs]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # For the release body. `docs/release-notes/<tag>.md` is written before
      # the tag is cut: it carries what
      # the release opens and the figures a Sage user decides on, with what
      # Sage dispatched to named beside each. The generated notes are appended
      # after it, so the commit list is still there without being the page.
      # A tag with no such file fails here rather than publishing a page that
      # says nothing, which is the intended reminder.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # Any tag that is not a bare `vX.Y.Z` is a prerelease. That is the state
      # the project is in while testers install from this page rather than from
      # a registry, and it is what keeps `pip install symfn` from resolving to
      # something nobody has run yet.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  pypi:
    name: publish to ${{ inputs.publish == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: [linux, musllinux, macos, windows, sdist]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["testpypi", "pypi", "pypi+crates"]'), inputs.publish)
    runs-on: ubuntu-latest
    # Configure a required reviewer on this environment: it is the lock that
    # holds even when the dispatch input is wrong.
    environment: ${{ inputs.publish == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      # Trusted publishing. No API token is stored anywhere in this repository.
      id-token: write
    steps:
      # `pattern` is load-bearing, not tidiness. The uploader posts everything
      # in `dist/`, and the docs bundle is a `.tar.gz` sitting beside the
      # sdist — an unfiltered download would offer PyPI `symfn-docs-0.1.0.tar.gz`
      # as a second source distribution. The distributable artifacts are the
      # `dist-*` ones; the docs bundle is named `docs` so it cannot match.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}

  crates:
    name: publish to crates.io
    needs: [linux, musllinux, macos, windows, sdist]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(fromJSON('["crates", "pypi+crates"]'), inputs.publish)
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      # Exchanges this run's OIDC identity for a short-lived crates.io token,
      # so the Rust half matches the Python half: no long-lived secret.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `--locked` so the published crate resolves to the lockfile the wheels
      # above were built from, rather than to whatever resolves at publish
      # time. A dry run first: `cargo publish` cannot be undone, only yanked.
      - run: cargo publish --locked --dry-run
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
