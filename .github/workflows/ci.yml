# CI — so the claims become checkable.
#
# Until this file existed, nothing in the repository had ever been built or
# tested anywhere except one macOS arm64 machine running rustc 1.96
# (docs/release-readiness.md, Phase 0). Every portability claim was a claim
# about one laptop.
#
# The **release** job is the one that is not merely a second copy of the debug
# run. `[profile.release] overflow-checks = true` is part of the correctness
# surface (docs/policies/failure.md, R3), and the tests that pin it —
# `tests/overflow_checks.rs` and the `ops.rs` escalation pair — only carry
# information in that profile. A CI that ran the default profile alone would
# report them green the day the flag left Cargo.toml.
# Third-party actions are pinned to a major and that major must run on
# **node24**: GitHub is retiring the node20 runtime, and every action still on
# it warns on each step it runs. `PyO3/maturin-action@v1` and
# `rust-lang/crates-io-auth-action@v1` are already node24 within their v1;
# `pypa/gh-action-pypi-publish` is a composite action and has no JS runtime at
# all. Check `runs.using` in an action's own `action.yml` before bumping,
# rather than assuming the newest major moved.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A superseded run teaches nothing and is not free. Without this, pushing a fix
# onto a red branch left the previous run going to completion beside the new
# one — observed, not theorized — so every fixup push paid for a second full
# matrix including the macOS legs, which are 6x Windows and 10x Linux per
# minute. Grouping on the ref means each PR and each branch has one live run;
# tags are their own refs, so a release candidate cannot cancel another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# `RUSTFLAGS: -D warnings` is set per job rather than here, and that is a
# correction rather than a style choice.
#
# **The variable replaces `.cargo/config.toml`'s `target.*.rustflags`; it does
# not add to them — and setting it empty is still setting it.** That file
# carries the `-undefined dynamic_lookup` pair a bare `cargo build --features
# python` needs on macOS, where the interpreter resolves the Python symbols at
# load time. A workflow-level `RUSTFLAGS` therefore discarded them and the
# `python` job failed on macOS, and only macOS, with a page of undefined `_Py*`
# symbols naming neither this file nor that one. The first attempt at a fix set
# `RUSTFLAGS: ""` on the affected jobs, which changed nothing: cargo reads the
# variable as present-and-empty and still overrides. YAML cannot unset an
# inherited environment variable, so the workflow-level one had to go.
#
# So: the jobs that want warnings denied say so, and the jobs that build the
# `python` feature leave the variable absent. Warnings under that feature are
# the `clippy` job's business.
#
# Second caveat, unchanged: `RUSTFLAGS` reaches *dependencies* too, so a future
# `num-bigint` that emits a warning fails the build through no fault of this
# crate. The default build has no dependencies at all, so only the `bignum`
# lanes carry that risk.

jobs:
  # Which platforms this run covers, decided once and consumed by the three
  # jobs that have an OS matrix.
  #
  # **A pull request gets Linux only; main and tags get all three.** The split
  # is about what a PR gate is for against what it costs: macOS is 6x Windows
  # and 10x Linux per runner-minute, so on one billing period it was 13% of the
  # minutes and 55% of the spend. Cross-platform breakage is real but rare and
  # is almost never what a PR introduces — it is found by the merge to main and
  # by the tag, both of which still run everything, before any artifact exists.
  # What a PR loses is the earlier signal, and what it buys is that the gate
  # keeps running at all.
  #
  # A computed matrix rather than duplicated jobs: `test`, `release` and
  # `python` each stay one definition, so a platform is added or dropped here
  # and nowhere else.
  platforms:
    name: platforms for this run
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      os_python: ${{ steps.pick.outputs.os_python }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'os_python=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'os_python=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      # `.githooks/pre-commit` already does this, but it is opt-in per clone
      # (`git config core.hooksPath .githooks`), so it is a convenience rather
      # than an enforcement. This is the enforcement.
      - run: cargo fmt --all --check

  test:
    name: test ${{ matrix.features }} on ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
        features: ["", "bignum"]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: test
        run: cargo test --features "${{ matrix.features }}"

  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    # `rust-version` in Cargo.toml is a claim, and this is what makes it one
    # that can be false. Pinned literally rather than read from the manifest:
    # if someone raises the floor, this job should fail until they raise it
    # here too and say why in the commit.
    #
    # Tests, not just `cargo build` -- the floor exists because of what the
    # *code* uses (`u32::is_multiple_of`, 1.87; `iter::repeat_n`, 1.82), and a
    # build alone would not compile the test targets that also use them.
    strategy:
      fail-fast: false
      matrix:
        features: ["", "bignum"]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87 --profile minimal
      - run: rustup default 1.87
      - run: cargo test --features "${{ matrix.features }}"

  release:
    name: release profile (overflow-checks) on ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # `--features bignum` rather than `--all-features`: the `python` feature
      # builds an `extension-module` cdylib, and a test binary linked against
      # one has no interpreter to resolve `_PyExc_*` against. That is why the
      # boundary's own pin lives in `scripts/check_schubert_bindings.py`.
      #
      # This lane also carries `tests/memory.rs`, whose budgets assert only
      # under `--release`. They should hold here: the counting allocator counts
      # `Layout` sizes it is handed, so peak live bytes and allocation counts
      # are properties of the program rather than of the system allocator.
      # If a platform disagrees, that is a finding and belongs in
      # docs/record/memory.md, not in a raised ceiling.
      - name: test (release)
        run: cargo test --release --features bignum

  python:
    name: python surface on ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux and macOS only, whatever the event. The wheel is built with
      # maturin, which supplies the interpreter configuration a bare
      # `cargo build` on Windows does not -- so Windows is absent here by
      # capability, not by cost, and `os_python` carries that separately.
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os_python) }}
    # No `RUSTFLAGS` here, deliberately and by absence rather than by an empty
    # value: this job runs `cargo build --features python`, which on macOS
    # needs the link arguments `.cargo/config.toml` carries, and any setting of
    # the variable — including `""` — discards them. See the note above the
    # `jobs:` key.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # No Sage on this runner, and that is the point: the wheel imports and
      # computes on a stock interpreter, or this job is red
      # (docs/policies/python.md, P3).
      # `mypy>=2.0` is a floor, not a preference: 1.x and 2.x disagree about
      # whether `check_basis`'s narrowing needs a `cast`, and nothing satisfies
      # both. `scripts/preflight_python.sh` skips an older one with a message,
      # which would silently turn this gate off if the runner ever shipped one.
      - run: pip install ruff "mypy>=2.0" -r docsite/requirements.txt
      # Builds `--features python` first, then runs every gate over the built
      # module: stubs, typed exceptions, both layers' docstring examples, the
      # convenience layer against the contract layer it is defined over, ruff,
      # and the rendered documentation's completeness.
      - run: scripts/preflight_python.sh

  wheel:
    name: the wheel builds and imports with no Sage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: pip install maturin
      # Installed rather than run from the tree: the failure this guards
      # against is the packaging one — a pure-Python module left out of the
      # wheel imports fine from the source directory and not at all from a
      # `pip install`.
      - run: pip install .
      - working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import symfn, sys
          from symfn import s, macdonald, jack, hl, llt, X
          assert s([2, 1]) * s([1]) == s([1]) * s([2, 1])
          assert macdonald.P([2]).at(q=5, t=5) == s([2]).to('m')
          assert jack.P([2]).at(alpha=1) == s([2]).to('m')
          assert hl.Qp([2, 1]).at(t=0) == s([2, 1])
          assert llt.G([[1], [1]]).basis == 'm'
          assert X[2, 1] ** 2 == X[3, 1, 2]
          assert symfn.schur_multiply([([2], 1)], [([1], 1)])
          assert not [m for m in sys.modules if m.startswith('sage')]
          print('symfn', symfn.__version__, 'imports and computes, no Sage')
          "

  package:
    name: the packaged crate tests from its own tarball
    runs-on: ubuntu-latest
    # `cargo test` on the published crate is meant to work, because that is
    # what a distro packager does with the tarball (docs/release-readiness.md,
    # Phase 4), and the `exclude` list is what decides whether it can: the
    # oracle suites `include_str!` their fixtures, so excluding `tests/` would
    # not slim the crate but break it. Until this job, that had been verified
    # once, by hand, on one laptop. Here the crate is packaged, unpacked
    # somewhere the source tree cannot be reached from, and its own suites
    # run there.
    steps:
      - uses: actions/checkout@v7
      - run: cargo package --features bignum
      - name: unpack and test the tarball
        run: |
          crate=$(ls target/package/symfn-*.crate)
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$crate" -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP"/unpacked/symfn-*
          cargo test
          cargo test --features bignum

  deny:
    name: dependencies stay permissive (gate)
    runs-on: ubuntu-latest
    # The gate under NOTICE.md's licensing claim — that nothing in the graph is
    # copyleft, so the wheel carries no obligation past `MIT OR Apache-2.0`.
    # That sentence is why the bignum backend is `num-bigint` and not
    # `rug`/GMP, and it is what a distro packager relies on. A transitive
    # dependency can falsify it without anyone editing Cargo.toml, which is
    # what makes this a CI job rather than a thing to remember.
    #
    # `deny.toml` also fails a dependency from anywhere but crates.io, because
    # that would defeat the offline sdist as well as the licensing claim.
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  coverage:
    name: coverage (report, not a gate)
    runs-on: ubuntu-latest
    # Never red: the report is read, not enforced. A coverage percentage is
    # not a claim this tree makes anywhere, and a threshold would either be
    # set where it passes today, which checks nothing, or fail on the next
    # workload added to the catalog. What the report is for is the question
    # docs/release-readiness.md Phase 7 asked — which paths no test reaches —
    # and docs/record/oracles-and-comparisons.md, "Coverage", holds the
    # answer as of the day it was first read.
    #
    # `--features bignum`, not `--all-features`: the `python` feature builds
    # an `extension-module` cdylib that no test binary can link. Doctests are
    # not instrumented (cargo-llvm-cov needs nightly for that), so a function
    # whose only check is its doctest reads as uncovered here; the record
    # section names the ones that are.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --features bignum --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --html --output-dir coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage

  docs:
    name: both references render (gate)
    runs-on: ubuntu-latest
    # No `RUSTFLAGS`, same reason as the `python` job: this one also runs
    # `cargo build --features python` and is one runner change away from the
    # macOS link failure. `cargo doc`'s own warnings are denied by
    # `RUSTDOCFLAGS` inside `scripts/build_docs.sh`, which this does not touch.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r docsite/requirements.txt
      # This is the first thing that holds `cargo doc --no-deps --all-features`
      # to being silent. CLAUDE.md has stated that the tree keeps it silent
      # since long before there was CI; the script denies rustdoc warnings, so
      # the claim can now be false. The Sphinx half is already gated in the
      # `python` job, and is rebuilt here because the bundle needs both halves
      # together.
      - run: scripts/build_docs.sh
      # Downloadable from every run, not only from a release. Neither reference
      # has a public home yet — Read the Docs will publish the Python half and
      # nothing publishes the Rust half — so this is where a reviewer reads
      # what a branch actually did to the documentation.
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: dist

  sdist:
    name: the sdist builds with the network off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install maturin
      # Every other Python job installs from the working tree with crates.io
      # reachable, so nothing else would notice a dependency the vendoring
      # missed. This is the Tier 2 platforms' only path to the library
      # (docs/support-tiers.md), and it is checked on every push rather than
      # first exercised at a release, because the way it breaks is a new
      # dependency landing in Cargo.toml -- an ordinary commit.
      - run: scripts/build_sdist.sh
      - run: scripts/check_sdist_offline.sh

  casts:
    name: narrowing casts (gate)
    runs-on: ubuntu-latest
    # `overflow-checks` cannot see an `as`, so these three lints are the only
    # thing that does, and the **library** is clean under all of them: every
    # cast that ships carries a check or a stated bound proof
    # (docs/policies/failure.md, R5). Five casts inside `src/`'s own
    # `#[cfg(test)]` modules are not clean and deliberately out of scope --
    # `--lib` does not compile them, which is the same line the paragraph below
    # draws for `tests/` and `examples/`.
    #
    # `--lib` on purpose. `[lints]` in Cargo.toml reaches examples and tests as
    # well, and those are research drivers whose index arithmetic never ships;
    # gating them would buy noise rather than exactness.
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: |
          cargo clippy --lib --all-features -- \
            -D clippy::cast_possible_truncation \
            -D clippy::cast_sign_loss \
            -D clippy::cast_possible_wrap

  clippy:
    name: clippy (gate)
    runs-on: ubuntu-latest
    # A gate as of the triage: the backlog is zero, so anything this reports is
    # new. **Zero is per toolchain, not absolute** — the first CI run of this
    # job found 40 errors that the laptop's clippy 0.1.96 did not have, because
    # 0.1.97 added `doc_overindented_list_items`, `useless_conversion` on an
    # identity `Vec`, and `manual_is_multiple_of`. Nothing had regressed; the
    # lint set grew. That is what this job is for, and it is why a red run here
    # should be read as "which clippy" before it is read as "what broke".
    #
    # The measured starting point was **180 warnings** across the union of
    # the four feature sets, not the 155 a single `--all-features` run showed --
    # the sets disagree because `#[cfg]` changes which code exists, which is why
    # this matrix runs all four rather than trusting `--all-features` to be a
    # superset (docs/record/failure-and-overflow.md).
    #
    # The three `cast_*` lints are allowed back *here* and gated in the `casts`
    # job above instead. They are set to `warn` in `[lints]` so they stay
    # visible locally, and `-D warnings` would otherwise promote the 56 of them
    # in `tests/` and `examples/` -- research drivers whose index arithmetic
    # never ships -- into build failures. Deny for the library, visible
    # everywhere, fatal nowhere else.
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features bignum", "--features python", "--all-features"]
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: |
          cargo clippy --all-targets ${{ matrix.features }} -- \
            -D warnings \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap
