# CI — so the claims become checkable.
#
# Until this file existed, nothing in the repository had ever been built or
# tested anywhere except one macOS arm64 machine running rustc 1.96
# (docs/release-readiness.md, Phase 0). Every portability claim was a claim
# about one laptop.
#
# The **release** job is the one that is not merely a second copy of the debug
# run. `[profile.release] overflow-checks = true` is part of the correctness
# surface (docs/policies/failure.md, R3), and the tests that pin it —
# `tests/overflow_checks.rs` and the `ops.rs` escalation pair — only carry
# information in that profile. A CI that ran the default profile alone would
# report them green the day the flag left Cargo.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A red build should be a real failure, not a warning that scrolled past. The
  # tree is warning-free across {default, bignum, python} × all targets as of
  # this file, which is what makes the gate affordable rather than instantly red.
  #
  # Caveat worth knowing before this fails mysteriously: `RUSTFLAGS` reaches
  # *dependencies* too, so a future `num-bigint` or `pyo3` that emits a warning
  # fails the build through no fault of this crate. The default build has no
  # dependencies at all, so only the `bignum` and `python` jobs carry that risk.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      # `.githooks/pre-commit` already does this, but it is opt-in per clone
      # (`git config core.hooksPath .githooks`), so it is a convenience rather
      # than an enforcement. This is the enforcement.
      - run: cargo fmt --all --check

  test:
    name: test ${{ matrix.features }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "bignum"]
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: cargo test --features "${{ matrix.features }}"

  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    # `rust-version` in Cargo.toml is a claim, and this is what makes it one
    # that can be false. Pinned literally rather than read from the manifest:
    # if someone raises the floor, this job should fail until they raise it
    # here too and say why in the commit.
    #
    # Tests, not just `cargo build` -- the floor exists because of what the
    # *code* uses (`u32::is_multiple_of`, 1.87; `iter::repeat_n`, 1.82), and a
    # build alone would not compile the test targets that also use them.
    strategy:
      fail-fast: false
      matrix:
        features: ["", "bignum"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.87 --profile minimal
      - run: rustup default 1.87
      - run: cargo test --features "${{ matrix.features }}"

  release:
    name: release profile (overflow-checks) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # `--features bignum` rather than `--all-features`: the `python` feature
      # builds an `extension-module` cdylib, and a test binary linked against
      # one has no interpreter to resolve `_PyExc_*` against. That is why the
      # boundary's own pin lives in `scripts/check_schubert_bindings.py`.
      #
      # This lane also carries `tests/memory.rs`, whose budgets assert only
      # under `--release`. They should hold here: the counting allocator counts
      # `Layout` sizes it is handed, so peak live bytes and allocation counts
      # are properties of the program rather than of the system allocator.
      # If a platform disagrees, that is a finding and belongs in
      # docs/record/memory.md, not in a raised ceiling.
      - name: test (release)
        run: cargo test --release --features bignum

  python:
    name: python surface on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux and macOS only. The wheel is built with maturin, which supplies
      # the interpreter configuration a bare `cargo build` on Windows does not.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No Sage on this runner, and that is the point: the wheel imports and
      # computes on a stock interpreter, or this job is red
      # (docs/policies/python.md, P3).
      # `mypy>=2.0` is a floor, not a preference: 1.x and 2.x disagree about
      # whether `check_basis`'s narrowing needs a `cast`, and nothing satisfies
      # both. `scripts/preflight_python.sh` skips an older one with a message,
      # which would silently turn this gate off if the runner ever shipped one.
      - run: pip install ruff "mypy>=2.0" -r docsite/requirements.txt
      # Builds `--features python` first, then runs every gate over the built
      # module: stubs, typed exceptions, both layers' docstring examples, the
      # convenience layer against the contract layer it is defined over, ruff,
      # and the rendered documentation's completeness.
      - run: scripts/preflight_python.sh

  wheel:
    name: the wheel builds and imports with no Sage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install maturin
      # Installed rather than run from the tree: the failure this guards
      # against is the packaging one — a pure-Python module left out of the
      # wheel imports fine from the source directory and not at all from a
      # `pip install`.
      - run: pip install .
      - working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import symfn, sys
          from symfn import s, macdonald, jack, hl, llt, X
          assert s([2, 1]) * s([1]) == s([1]) * s([2, 1])
          assert macdonald.P([2]).at(q=5, t=5) == s([2]).to('m')
          assert jack.P([2]).at(alpha=1) == s([2]).to('m')
          assert hl.Qp([2, 1]).at(t=0) == s([2, 1])
          assert llt.G([[1], [1]]).basis == 'm'
          assert X[2, 1] ** 2 == X[3, 1, 2]
          assert symfn.schur_multiply([([2], 1)], [([1], 1)])
          assert not [m for m in sys.modules if m.startswith('sage')]
          print('symfn', symfn.__version__, 'imports and computes, no Sage')
          "

  docs:
    name: both references render (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r docsite/requirements.txt
      # This is the first thing that holds `cargo doc --no-deps --all-features`
      # to being silent. CLAUDE.md has stated that the tree keeps it silent
      # since long before there was CI; the script denies rustdoc warnings, so
      # the claim can now be false. The Sphinx half is already gated in the
      # `python` job, and is rebuilt here because the bundle needs both halves
      # together.
      - run: scripts/build_docs.sh
      # Downloadable from every run, not only from a release. Neither reference
      # has a public home yet — Read the Docs will publish the Python half and
      # nothing publishes the Rust half — so this is where a reviewer reads
      # what a branch actually did to the documentation.
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist

  sdist:
    name: the sdist builds with the network off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      # Every other Python job installs from the working tree with crates.io
      # reachable, so nothing else would notice a dependency the vendoring
      # missed. This is the Tier 2 platforms' only path to the library
      # (docs/support-tiers.md), and it is checked on every push rather than
      # first exercised at a release, because the way it breaks is a new
      # dependency landing in Cargo.toml -- an ordinary commit.
      - run: scripts/build_sdist.sh
      - run: scripts/check_sdist_offline.sh

  casts:
    name: narrowing casts (gate)
    runs-on: ubuntu-latest
    # `overflow-checks` cannot see an `as`, so these three lints are the only
    # thing that does, and the **library** is clean under all of them: every
    # cast that ships carries a check or a stated bound proof
    # (docs/policies/failure.md, R5). Five casts inside `src/`'s own
    # `#[cfg(test)]` modules are not clean and deliberately out of scope --
    # `--lib` does not compile them, which is the same line the paragraph below
    # draws for `tests/` and `examples/`.
    #
    # `--lib` on purpose. `[lints]` in Cargo.toml reaches examples and tests as
    # well, and those are research drivers whose index arithmetic never ships;
    # gating them would buy noise rather than exactness.
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: |
          cargo clippy --lib --all-features -- \
            -D clippy::cast_possible_truncation \
            -D clippy::cast_sign_loss \
            -D clippy::cast_possible_wrap
        env:
          RUSTFLAGS: ""

  clippy:
    name: clippy (gate)
    runs-on: ubuntu-latest
    # A gate as of the triage: the backlog is zero, so anything this reports is
    # new. **Zero is per toolchain, not absolute** — the first CI run of this
    # job found 40 errors that the laptop's clippy 0.1.96 did not have, because
    # 0.1.97 added `doc_overindented_list_items`, `useless_conversion` on an
    # identity `Vec`, and `manual_is_multiple_of`. Nothing had regressed; the
    # lint set grew. That is what this job is for, and it is why a red run here
    # should be read as "which clippy" before it is read as "what broke".
    #
    # The measured starting point was **180 warnings** across the union of
    # the four feature sets, not the 155 a single `--all-features` run showed --
    # the sets disagree because `#[cfg]` changes which code exists, which is why
    # this matrix runs all four rather than trusting `--all-features` to be a
    # superset (docs/record/failure-and-overflow.md).
    #
    # The three `cast_*` lints are allowed back *here* and gated in the `casts`
    # job above instead. They are set to `warn` in `[lints]` so they stay
    # visible locally, and `-D warnings` would otherwise promote the 56 of them
    # in `tests/` and `examples/` -- research drivers whose index arithmetic
    # never ships -- into build failures. Deny for the library, visible
    # everywhere, fatal nowhere else.
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--features bignum", "--features python", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: |
          cargo clippy --all-targets ${{ matrix.features }} -- \
            -D warnings \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_possible_wrap
        env:
          RUSTFLAGS: ""
