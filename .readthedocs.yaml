# Read the Docs builds the wheel, then documents the objects in it.
#
# The Rust toolchain is not optional here. The reference is generated from the
# module's own docstrings — the `///` PyO3 ships as `__doc__` — so there is one
# copy of every sentence and `help()` and the website cannot disagree. That
# requires importing the compiled module, which requires building it.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"

sphinx:
  configuration: docsite/conf.py
  # A docstring that stops rendering is a broken page, and the house form is
  # translated to RST by a hook in `conf.py` that a new construction can escape
  # — see `markdown_docstrings` there. Warnings are how that gets noticed.
  fail_on_warning: true

python:
  install:
    - requirements: docsite/requirements.txt
    # Builds through maturin, which is what `[build-system]` in pyproject.toml
    # selects; no Sage anywhere, at build time or import time.
    - method: pip
      path: .
