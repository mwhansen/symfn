# cargo-deny — the gate under NOTICE.md's licensing claim.
#
#     cargo deny --all-features check
#
# NOTICE.md states that nothing in the dependency graph is copyleft, so the
# published wheel carries no obligation beyond `MIT OR Apache-2.0`. That claim
# is load-bearing: it is why `rug`/`gmp-mpfr-sys` were rejected for the bignum
# backend in favor of `num-bigint` (Cargo.toml says so at the dependency), and
# it is what a Sage or distro packager relies on when they ship the wheel.
# Until this file existed nothing stopped a future dependency — or a
# transitive one, arriving without anyone editing Cargo.toml — from quietly
# making it false.
#
# Measured at the revision this file landed: 19 dependencies across all
# features, every one of them permissive.

[graph]
# `--all-features`, because the default build has no dependencies at all and
# checking it would prove nothing. The graph that matters is the wheel's.
all-features = true

[licenses]
# The exact set the graph resolves to, not a category. An allow-list of
# licenses is checkable; "no copyleft" is a judgment that has to be re-made
# every time something new appears, which is the thing this file replaces.
#
#   Apache-2.0 WITH LLVM-exception   target-lexicon, via pyo3-build-config
#   Unicode-3.0                      unicode-ident, in a conjunction with the
#                                    usual dual license, so both apply
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]

[bans]
# A warning rather than an error: duplicate versions are a build-size and
# correctness question, not a licensing one, and this file's job is the claim
# above. The one duplication that *would* be a correctness failure is already
# prevented by hand — Cargo.toml pins num-bigint to 0.4 to match what pyo3
# links against, because a second incompatible BigInt would compile and then
# fail to convert.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# A dependency from anywhere but crates.io would also defeat
# `scripts/build_sdist.sh`: `cargo vendor` can carry a git dependency, but the
# offline source build stops being reproducible from a registry the way distro
# packagers expect.
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# A yanked release is usually yanked for a reason, and the sdist pins exactly
# what it vendored, so shipping one would propagate it to every source build.
yanked = "deny"
