[package]
name = "symfn"
version = "0.1.0-rc.1"
edition = "2021"
# Chosen, not discovered: `u32::is_multiple_of` (1.87) and `iter::repeat_n`
# (1.82) are what the divisibility and padding loops read as, and this is the
# floor that buys both. Verified by building and testing the whole tree on
# 1.87.0, not inferred from the manifest. Raising it is a breaking change for
# the distro packagers who build from source (docs/release-readiness.md,
# Phase 5c), so the bar for moving it again is a lint fix that reads better.
rust-version = "1.87"
description = "A modern, fast kernel for computing with symmetric functions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mwhansen/symfn"
keywords = ["symmetric-functions", "combinatorics", "algebra", "schur", "littlewood-richardson"]
categories = ["mathematics", "science"]

# The core crate deliberately depends on NOTHING so it builds offline and stays
# a clean, testable Rust library. Littlewood-Richardson is computed natively in
# Rust (no external C library). The remaining backends are optional and gated
# behind features so they never pollute the core dependency graph:
#
#   bignum  -> arbitrary-precision coefficients (`num-bigint`), for the escalation
#              path when a fixed-width computation overflows
#   python  -> a PyO3/maturin wrapper exposing a coarse-grained API into Sage
#
# The bignum backend is `num-bigint` and deliberately not GMP. Measured
# (`examples/coeff_sizes.rs`): coefficients past i128 are 2-5 limbs, where every
# library runs schoolbook and GMP's Karatsuba/Toom/FFT never engage, and
# coefficient arithmetic is ~4% of runtime anyway. So the requirement is
# exactness, not speed -- and `rug`/`gmp-mpfr-sys` are LGPL-3.0+, which would
# attach LGPL terms to a wheel this crate keeps MIT OR Apache-2.0, plus a C
# toolchain and `m4` to build. num-bigint is pure Rust and permissive.
#
# The default build stays dependency-free, so `cargo test` works with no system
# libraries installed.
[lib]
name = "symfn"
# rlib for Rust consumers; cdylib so the `python` feature can produce an
# importable extension module.
crate-type = ["rlib", "cdylib"]

[features]
default = []
bignum = ["dep:num-bigint", "dep:num-rational", "dep:num-traits"]
# The wheel always carries the escalation ring, and PyO3's own num-bigint /
# num-rational conversions turn those into Python int / Fraction natively, so no
# value is ever encoded as a string on the way out.
python = ["dep:pyo3", "bignum", "pyo3/num-bigint", "pyo3/num-rational"]

[dependencies]
# Pinned to 0.4 to match what pyo3 0.29 links against. A 0.5 here would compile
# and then produce a *second, incompatible* BigInt that pyo3 cannot convert.
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint-std"], optional = true }
num-traits = { version = "0.2", optional = true }
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py39"] }

[dev-dependencies]

# Needs the arbitrary-precision types to have an exact reference to measure
# against. Without this, a plain `cargo test` tries to build it and fails.
[[example]]
name = "coeff_sizes"
required-features = ["bignum"]

# Runs both Kronecker routes over `BigRational` so the comparison is exact at
# every degree — the whole point being that neither side is the fixed-width one.
[[example]]
name = "bench_kron_coeff"
required-features = ["bignum"]

# `overflow-checks` below does not reach `as` casts — nothing does, which is
# why narrowing is where overflow bugs live (`docs/record/littlewood-richardson.md`).
# These three are the only lints that see them, and `src/` is now clean under
# all three: every remaining cast carries either a check or the one-line bound
# proof that justifies it (`docs/policies/failure.md`, R5).
#
# Warn rather than deny *here* because `[lints]` applies to examples and tests
# too, and those are research drivers whose index arithmetic never ships. The
# **library** is gated at deny in CI, which is the surface R5 is about.
[lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

# The two lints the triage kept off, with the reason, so a future reader does
# not re-litigate them site by site (`docs/release-readiness.md`, Phase 0).
#
# `needless_range_loop` fires 19 times and is wrong at essentially all of them:
# the loop variable here is a *mathematical coordinate* -- a column of a Young
# diagram, a content value, a part index read at an offset -- not a cursor over
# a collection. `for j in 0..mu[i]` next to `arm(mu, i, j)` and `arm(lam, i, j)`
# is the notation the source it is transcribed from uses; `.iter().enumerate()`
# over one of two partitions being indexed by the same j reads worse and hides
# which slice is being walked. Where the iterator form genuinely won, the fix
# was taken instead of the exemption.
#
# `type_complexity` fires 16 times, 9 of them on `#[pyfunction]` signatures
# whose shape is mandated: `docs/policies/python.md` requires plain ring-free
# data crossed whole-object, which is exactly what makes
# `Vec<(Vec<u32>, Vec<(u32, u32, Coeff)>)>` the contract rather than an
# accident. A newtype there would satisfy the lint by breaking the policy.
needless_range_loop = "allow"
type_complexity = "allow"

# Overflow that was foreseen is handled by the escalation ladder; this converts
# the overflow that was *not* from silent to loud, in the profile users actually
# ship. See `docs/policies/failure.md` (R3) for why the burden of proof sits on
# turning it off, and `docs/record/failure-and-overflow.md` for what it costs:
# measured interleaved against the same tree without it, 0-2% on the skew-LR
# layer, 1.4% on the Python-boundary workload, at most ~6% on any bench_ops
# row, and nothing at all on the bignum routes. Peak live bytes and allocation
# counts are unchanged, so none of that is an allocation confound.
#
# `overflow-checks` reaches neither `as` casts nor `wrapping_*`, which have
# their own rules (R5, R4). It is a net, not an interface: a caller-reachable
# wall gets a real mechanism instead.
[profile.release]
overflow-checks = true

# Same codegen as `release`, plus symbols, so a sampling profiler can attribute
# frames. Kept separate so profiling never rebuilds — and so never perturbs —
# the `release` binary the lrcalc comparison is measured against.
#
#   cargo build --profile profiling --example profile_wide
#   ./target/profiling/examples/profile_wide & sample $! 20 -f /tmp/wide.txt
[profile.profiling]
inherits = "release"
debug = true
